[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-supply-chain-guardian-agents"
version = "0.1.0"
description = "Agent framework for the Software Supply Chain Guardian"
requires-python = ">=3.12"

dependencies = [
    "langgraph>=0.2,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
