<text x="560" y="834" class="lab" text-anchor="middle">retry ≤ 2</text>
<path d="M790,870 L790,892 L560,892 L560,915" fill="none" stroke="#4a5260" stroke-width="2"  marker-end="url(#a)"/>
<text x="600" y="888" class="lab" text-anchor="start">claims verified</text>
<path d="M560,1005 L560,1060" fill="none" stroke="#4a5260" stroke-width="2"  marker-end="url(#a)"/>
<text x="572" y="1037" class="lab" text-anchor="start">any approved</text>
<path d="M310,960 L100,960 L100,1340 L200,1340 L200,1355" fill="none" stroke="#4a5260" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="108" y="1100" class="lab" text-anchor="start">none approved /</text>
<text x="108" y="1116" class="lab">analysis only</text>
