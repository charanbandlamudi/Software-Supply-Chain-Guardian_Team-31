<path d="M690,1305 L690,1330 L810,1330 L810,1355" fill="none" stroke="#4a5260" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="700" y="1324" class="lab" text-anchor="start">human clicks Open draft PR</text>
<rect x="1100" y="90" width="290" height="1365" rx="12" fill="#fafbfc" stroke="#cfd5dd" stroke-width="1.5"/>
<text x="1118" y="128" class="st">Supervisor (LangGraph)</text>
<text x="1118" y="150" class="sl">runs agents when all their inputs</text>
<text x="1118" y="168" class="sl">are ready; parallel supersteps</text>
<text x="1118" y="186" class="sl">(T1, T2, T3 run side by side)</text>
<text x="1118" y="204" class="sl">re-runs an agent if an input changes</text>
<text x="1118" y="262" class="st">Shared state blackboard</text>
<text x="1118" y="284" class="sl">components · edges · findings</text>
<text x="1118" y="302" class="sl">evidence · plans · audit</text>
<text x="1118" y="320" class="sl">keyed deep-merge reducers keep</text>
<text x="1118" y="338" class="sl">parallel writes from clobbering</text>
<text x="1118" y="396" class="st">Policy firewall</text>
<text x="1118" y="418" class="sl">every tool action checked by</text>
<text x="1118" y="436" class="sl">policy.py + OPA rego</text>
<text x="1118" y="454" class="sl">merge / publish / deploy = human only</text>
<text x="1118" y="512" class="st">Audit trail</text>
<text x="1118" y="534" class="sl">hash-chained events, sealed</text>
<text x="1118" y="552" class="sl">by the supervisor; head hash</text>
<text x="1118" y="570" class="sl">shown in every report</text>
<text x="1118" y="628" class="st">LLM boundary</text>
<text x="1118" y="650" class="sl">LLM sees structured evidence only</text>
<text x="1118" y="668" class="sl">(no code, no secrets); it never</text>
<text x="1118" y="686" class="sl">decides severity, versions,</text>
<text x="1118" y="704" class="sl">fixes or approvals</text>
<text x="1118" y="762" class="st">Checkpoints</text>
<text x="1118" y="784" class="sl">SQLite snapshots per run</text>
<text x="1118" y="802" class="sl">resume after interruption</text>
<text x="1118" y="860" class="st">Legend</text>
<rect x="1118" y="876" width="26" height="18" rx="4" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2"/>
<text x="1154" y="890" class="sl">deterministic agent</text>
<rect x="1118" y="904" width="26" height="18" rx="4" fill="#f1e8fd" stroke="#8a4fd8" stroke-width="2"/>
<text x="1154" y="918" class="sl">LLM agent (checked)</text>
<rect x="1118" y="932" width="26" height="18" rx="4" fill="#fff4dc" stroke="#d08a00" stroke-width="2"/>
<text x="1154" y="946" class="sl">human decision</text>
<rect x="1118" y="960" width="26" height="18" rx="4" fill="#e5f6ea" stroke="#2e9a50" stroke-width="2"/>
<text x="1154" y="974" class="sl">isolated sandbox</text>
<rect x="1118" y="988" width="26" height="18" rx="4" fill="#eef0f3" stroke="#5b6573" stroke-width="2"/>
<text x="1154" y="1002" class="sl">outputs</text>
